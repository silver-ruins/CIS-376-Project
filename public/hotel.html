<!doctype html>

<html>

<head>

  <title>
    hotel
  </title>

</head>

<body>

  <h1>
    client → server data
  </h1>

  <button id="sendData">
    send data
  </button>

  <pre id="output"></pre>

  <script>

    document
      .querySelector('#sendData')
      .addEventListener(
        'click',
        sendData
      );

    async function sendData() {

      const student = {

        name:
          'Lasagna',

        major:
          'CIS'

      };

      const response =
        await fetch(
          '/api/students',
          {

            method:
              'POST',

            headers: {

              'Content-Type':
                'application/json'

            },

            body:
              JSON.stringify(
                student
              )

          }
        );

      const data =
        await response.json();

      document
        .querySelector('#output')
        .textContent =
          JSON.stringify(
            data,
            null,
            2
          );

    }

  </script>
